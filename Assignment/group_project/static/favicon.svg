<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f5"/>
      <stop offset="50%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#eeeeee"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0.5" dy="0.5" stdDeviation="0.5" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowHead" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#000"/>
    </marker>
  </defs>
  <!-- Rounded square background -->
  <rect x="1" y="1" width="30" height="30" rx="6" ry="6" fill="url(#bgShade)" stroke="#e0e0e0" stroke-width="0.5" filter="url(#softShadow)"/>
  <!-- Left arc: bottom-left to top-left (arrow at top-left, ~10–11 o'clock) -->
  <path d="M 6 26 A 10 10 0 0 1 6 6" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowHead)"/>
  <!-- Right arc: top-right to bottom-right (arrow at bottom-right, ~4–5 o'clock) -->
  <path d="M 26 6 A 10 10 0 0 1 26 26" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowHead)"/>
</svg>
