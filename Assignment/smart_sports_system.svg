  <text x="190" y="1332" font-size="10" text-anchor="middle" fill="#2563eb">• Noise level</text>
  <text x="190" y="1349" font-size="10" text-anchor="middle" fill="#2563eb">• Motion data</text>
  
  <!-- Module 2 -->
