  <text x="1210" y="1425" font-size="13" font-weight="bold" text-anchor="middle" fill="#5b21b6">MODULE 4</text>
  <text x="1210" y="1445" font-size="11" text-anchor="middle" fill="#5b21b6">Security Dashboard</text>
  <text x="1210" y="1465" font-size="10" text-anchor="middle" fill="#7c3aed">• Alerts</text>
  <text x="1210" y="1482" font-size="10" text-anchor="middle" fill="#7c3aed">• Monitoring</text>
  <text x="1210" y="1499" font-size="10" text-anchor="middle" fill="#7c3aed">• Priorities</text>
  
