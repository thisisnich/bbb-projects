  <text x="700" y="1825" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">DATA FLOW LEGEND</text>
  <text x="520" y="1850" font-size="11" fill="#1f2937">• Modules 1-3 send sensor data to Cloud</text>
  <text x="520" y="1870" font-size="11" fill="#1f2937">• Cloud processes, stores, analyzes</text>
  <text x="520" y="1890" font-size="11" fill="#1f2937">• Cloud sends alerts to Module 4 (Security)</text>
  <text x="520" y="1910" font-size="11" fill="#1f2937">• Cloud sends insights to Module 5 (Public)</text>
</svg>