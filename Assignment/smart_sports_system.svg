  <text x="380" y="1480" font-size="11" fill="#059669" font-weight="bold">Weather Data</text>
  
  <path d="M 280 1610 Q 450 1590 520 1560" stroke="#dc2626" stroke-width="3" fill="none" marker-end="url(#arrowred)"/>
  <text x="380" y="1600" font-size="11" fill="#dc2626" font-weight="bold">Ratings</text>
  
  <!-- Arrows from Cloud to Modules 4-5 -->
  <path d="M 880 1520 Q 1000 1480 1120 1460" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#arrowpurple)"/>
  <text x="960" y="1490" font-size="11" fill="#7c3aed" font-weight="bold">Alerts</text>
  
  <path d="M 820 1620 Q 970 1700 1120 1760" stroke="#ea580c" stroke-width="3" fill="none" marker-end="url(#arroworange)"/>
  <text x="930" y="1680" font-size="11" fill="#ea580c" font-weight="bold">Insights</text>
  
  <!-- WiFi indicators -->
  <text x="400" y="1260" font-size="20" fill="#2563eb">📶</text>
  <text x="400" y="1410" font-size="20" fill="#059669">📶</text>
  <text x="400" y="1560" font-size="20" fill="#dc2626">📶</text>
  <text x="1000" y="1410" font-size="20" fill="#7c3aed">📶</text>
  <text x="1000" y="1710" font-size="20" fill="#ea580c">📶</text>
  
  <!-- Legend -->
