  <text x="190" y="1615" font-size="10" text-anchor="middle" fill="#dc2626">• User ratings</text>
  <text x="190" y="1632" font-size="10" text-anchor="middle" fill="#dc2626">• Maintenance</text>
  <text x="190" y="1649" font-size="10" text-anchor="middle" fill="#dc2626">• Issues</text>
  
  <!-- Module 4 -->
