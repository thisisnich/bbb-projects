  <text x="1210" y="1725" font-size="13" font-weight="bold" text-anchor="middle" fill="#9a3412">MODULE 5</text>
  <text x="1210" y="1745" font-size="11" text-anchor="middle" fill="#9a3412">Court Display</text>
  <text x="1210" y="1765" font-size="10" text-anchor="middle" fill="#ea580c">• Status</text>
  <text x="1210" y="1782" font-size="10" text-anchor="middle" fill="#ea580c">• Predictions</text>
  <text x="1210" y="1799" font-size="10" text-anchor="middle" fill="#ea580c">• Recommendations</text>
  
