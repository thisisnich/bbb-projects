  <text x="190" y="1445" font-size="11" text-anchor="middle" fill="#047857">Environment</text>
  <text x="190" y="1465" font-size="10" text-anchor="middle" fill="#059669">• Temperature</text>
  <text x="190" y="1482" font-size="10" text-anchor="middle" fill="#059669">• UV index</text>
  <text x="190" y="1499" font-size="10" text-anchor="middle" fill="#059669">• Comfort score</text>
  
