<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lab 6a — BBBW Connected System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
      <div class="container-fluid">
        <span class="navbar-brand">EGE205 Lab 6a Dashboard</span>
        <span class="text-white-50">Server Time: <span id="serverTime">--</span></span>
      </div>
    </nav>

    <main class="container">
      <section class="card shadow-sm mb-4">
        <div class="card-body">
          <h5 class="card-title">Broadcast Controls</h5>
          <div class="d-flex flex-wrap gap-2">
            <button class="btn btn-success" data-command="start">Start</button>
            <button class="btn btn-warning" data-command="stop">Stop</button>
            <button class="btn btn-secondary" data-command="reset">Reset</button>
          </div>
          <small class="text-muted">Applies to all clients. Use the per-row actions for specific boards.</small>
        </div>
      </section>

      <section class="card shadow-sm">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="card-title mb-0">Connected BBBW Boards</h5>
            <button id="refreshBtn" class="btn btn-outline-primary btn-sm">Refresh</button>
          </div>
          <div class="table-responsive">
            <table class="table table-striped align-middle">
              <thead>
                <tr>
                  <th>Client ID</th>
                  <th>Board</th>
                  <th>Sensor</th>
                  <th>Location</th>
                  <th>Status</th>
                  <th>Last Seen</th>
                  <th>Last Payload</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="clientsTable">
                <tr>
                  <td colspan="8" class="text-center text-muted">No clients yet</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
  </body>
</html>
